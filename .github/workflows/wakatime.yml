name: Waka Readme

on:
  schedule:
    # Runs at 12pm CST
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROFILE_VIEWS: True
          SHOW_LINES_OF_CODE: True
          SHOW_TOTAL_CODE_TIME: True
          SHOW_AI_CODE_TIME: True
          SHOW_AI_CODING: True
          SHOW_COMMIT: True
          SHOW_DAYS_OF_WEEK: True
          SHOW_LANGUAGE: True
          SHOW_PROJECTS: False
          SHOW_SHORT_INFO: True
          SHOW_LOC_CHART: True
          SHOW_UPDATED_DATE: True
          SHOW_OS: False
          SHOW_TIMEZONE: False
          SHOW_EDITORS: False
          SYMBOL_VERSION: "1"
          BADGE_STYLE: "flat"
          LOCALE: "en"
